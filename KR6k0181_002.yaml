body:
  text: 第十三衣鉢坐具針筒盛衣貯器及俱夜羅器此方譯為隨鉢器即鉢內所宬者也剃刀律並斷輕其例有三初衣二器三革履事通五衆一現成衣服初明出家所服後明非出家所服謂三衣覆膊祇支裙衫帔服坐具諸雜衣裳等其例有四已前一件隨身所服名雖多別莫不障形故也若依僧祇云覆瘡衣雨浴衣漉水囊二種腰帶臥具入分五分又云劫具衣單𭤈衣𭣋身衣若被即臥具之異名也若下衣若舍勒四分云涅槃僧此名內衣即舍勒也是可分物準上為斷要是純色所成若是五納之衣律本開用五大上色作之雖綺錯分明乃是山成自爾既為聖道標式宜從分之若錦綺文成之衣並如後斷其下領袍長袖褊袒祇支加覆苦覆膊增襻胸如此雜類衣裳形名難具亦並輕分由體相乖俗色類不同不名白衣所服即開隨用之限又偏袒裙衫震旦法衣祇支覆膊天竺本制將彼例此樣貌俱非而猶同判在輕曾無憚懾若統收衣服相狀皆非本儀故僧祇中覆肩祇支皆長四肘二肘今且約道俗兩分故開輕重若深取律制裙衫亦非故律中著脫法式此方不委如十誦中褊袖衣復貯衣等並不令服故二隨衣所有謂鉤帶腰繩等用銅鐵竹木鉛錫所成并衣袋箱襆等已前一件並隨衣入輕又如五分針線囊入輕衣袋前至齊後至腰者亦入輕準上諸袋襆等若以綺錯所成雖無文相而同俗中被袋類者不入分限三成衣財具謂布絹綾羅紬絁褐褻綿絮之屬及錦綺繡斑雲霞之像等已前一件義通重輕若布絹乃至綿絮之財但非綺色分明者入分若錦繡氍氀純同一色相狀減於法衣者同上輕分若以青黃赤白黑五大色染并緋碧紅緑紫等上色染成者無問多少輕重並從衣財入分若補方虎眼檳榔接正衆綵間錯者入重故五分中錦綺毛𣯟若氈謂廣長量如上大者蚊厨入重故也又不同綾羅之財雖衣體交錯而色相純同故律開著細鵝文相衣也義準綾羅絞梭入輕律開受王大價衣及種種好衣并開大價疏衣即知紗葛之屬例分也四能成縷線謂雜色諸線無問絲布紵葛纑緝之類及麻綟絲絢等已前準斷如善見中針線入輕則不論多少並從分也若有蟲之繭著芋之麻並從重收二是外道白衣之服律無正斷如下義分其例自二初是外道之衣律本云繡衣樹皮衣樹葉衣珠瓔珞衣木鉢及一切外道衣皮衣鳥毛衣人髮馬毛猫牛尾衣等欽跋羅衣乃至唐國李老餘胤黃幆巾帔等已前律制不著義斷重科由是異道標相非正之服故也若有所施與亦開受之若已壞其色相者除樹皮毛髮餘者準下入輕分也二者是一切白衣所服律無正斷義須例準其例自五初常所服用謂士女袍襖子衫袴褌裳裙帔巾帽被矜氈褥靴履之屬已前義判須分二途謂今昔兩判也準昔解云亡五衆生常服用同世軌儀者入重故佛言一切白衣服不得畜為斷惡法次第理從重收今不同之雖文令不服此非斷重也犯捨財食生過極多死尚開分故非重攝如後義判若俗人奉施僧得而未暇改正為法衣者準斷入輕有多義故一佛開受施二聽說淨三聽改變如法受用若色未改相狀俗衣並入重收為絶懷俗之心也廣如鈔中不同錦綺以體相同俗必壞色相者聽分此但相乖而堪附道服故開改用若有長髮沙門心希名貫衫袴隨俗都絶三衣道在虛通俗存我固既思名繫將何為道無問死活俱不可分余聞戲女暫披法衣生生常在僧位今則貪名樂於俗服義必劫劫恆居背真理路顯然豈在輕限又諸律無斷重者必緣障不許披法服者縱著俗衣不須入輕雖佛開著非久用故如賊奪恐難之類自餘巾帶等服定非道用例準重收氈蓐二件同上所判故也二御暑雨之服謂褐衣羊裝油帔梭䒾笠子障熱傘蓋等三御寒之服謂皮裘貂瓔狐狢帽蓐耳手足諸擬宜者四莊飾之服謂花叉纓絡環釧珮綬治身衆具及鏡奩裝匣瑩飾五朝宗祭服謂冠幘貂纓大袖裙褶革帶履舄等已前五件並是俗人所服而比丘時有得者須分判之初一之中羊裝褐衣全俗服類如上非輕第二皮服律正制止無宜有開必是熟財微供資下亦許分也第三裝飾之具彌是所制律本具之俗態未除理須除遣尚不許捉何得在輕第四朝服雖非所應然衫褶之類堪從改換可入輕收冠革之徒宜從重攝餘者例之二器具資要律斷鉢器入輕餘者隨事附見其例有四初是正鉢謂量是三斗已下斗半已上體是瓦鐵色唯熏治者是如法器二是隨鉢謂次鉢小鉢鍵𮢯鼻奈耶云小淺鐵鉢并銅鍮碗盞大小如前量也及以七筋等總名俱夜羅器也三隨器所宬謂函袋襆絡巾帊等已前三件若鉢器量體色依法者律正斷輕必體是竹木布帛色是漆油棍鑒者入重故僧祇云過量白鉢瓷瓦鐵等入重以體量不如故也不同瓶罐等但令量如即堪從用此是應量彌須準正其餘隨鉢律本斷輕而但云俱夜羅器不顯其相如五正蒲闍尼五非正佉闍尼等而有總別二名者也若準十誦云小鉢半鉢鍵𨩲入分其隨器袋襆律亦斷賞勞理從輕限故五分中鉢囊入分亦有繡綵裝飾者可單抽重收事同繡錦之服四針筒具謂銅瓦木鐵鳥翮所成者律斷賞勞義非正重已前一事乃是小緣人必有之理須分處中國多用牙角作者律制打破開畜如前宜入輕分或以氈作者或錯綵莊嚴者或繡纈結絡者或作錯綺綵袋號為針線袋也並是華綺俱從重收若純色氈袋并所𡷫之鉢無問銅鐵多少並即分也必積針擬貨亦準上通三資下之具謂皮革屣鞋屩鞾襪巾布裹足及隨有袋襆等巾帊裹束者已前一件正律唯明革履一色餘者不明依僧祇五分斷革屣及囊入分必現有熟皮準十誦中繫革屣韋鞾韋鹿韋熟韋裏腳指韋應分必有生皮理從重攝然此神州都不服用嶺表劒南時有著者若南海諸國五竺道俗皆常所履服也其形如此方摺屐狀兼施後踵邊耳全無多以革皮作之若以鞾履例準義亦開分鞾履鞋屨時有三臺龍鳳及錯線綺繡刺成者若非純色宜入重收或有平鞾尖鞾律無正斷然五分中以靴𩍓太深為世所譏理非懷道者所踐平鞾異俗可入輕分尖全乖道準入重攝若準天竺復羅形如皮鞾面前決開行則左右掩繫必平尖二鞾似此相從並準入輕餘有短𩍓高頭類列亦宜從履屨同斷重之曰上準律文例斷出處的明而神解不同意用難約理須分門逞路以義相收然重輕兩物罪相須知必先究委定其綱致則相種曉據便處斷懍然譬臨深履薄詳而後述者其在茲乎然僧物乃多或一部二部或四種八種今但約位就人四科皆盡故隨科條理並如下引一局限常住僧物謂約界限不通餘寺恆供別住故云然也物相如何即田園房宇山林池澤人畜等是也若盜損斯物罪科二重有主望監治即主掌者無護通僧結滿五皆擯棄不至須衆治有人言盜僧物者唯結偷蘭由體遍四方之僧乃錢不滿五故也如律中時有比丘盜分僧物以為四分但結偷蘭者文成證也余則謂之不然何者律據暫遮僧也初為在村行惡污染俗家僧衆往檳故生斯計分物且屬四人僧則住無安所內財既不有損外跡彌復澄消以此遮僧可為明略然本非長永故罪事不成律據本情依情權結所以身子目連深鑒緣據還依本計明判不成故使衆僧仍舊復用若盜必結正隨物多少雖罪階二位謂滿五波羅夷減五偷蘭遮也莫非決屬也若奪斯物望主極刑以損我故罰他罪則究竟若不損故還我罪則方便方便故可奪彼此無瑕究竟故屬他自他同惱出在僧祇聖量明乎善見婆沙故彼律云時有知事比丘以僧物為佛法兩用佛言波羅夷此豈望四方而通方便也必若疑於四方常住交雜重輕者又彼文云假使能集十方僧共分此物亦不得也故知通望一僧總為一主畢竟無分此物也如何約數言可分之言可分者謂四方現前及四方常住物耳律本乃云若僧若衆多人若一人不應分此物賣此物及自入己者此據別時因過為言若諸部相融分賣明顯故律令回易田地論許轉𧵍房堂開則坦然公行制則為遮心過必有須微奪者不得不微皆謂賊情猶豫未決也今別屬已定如何還奪若故奪者還及坐之故律本云時有奪劫者物佛言波羅夷是名賊復奪賊正教如此奪剝彌難既令他犯盜必須納現贓贓既返收罪便虛結非為損物盜則空來若此任法司便推繩酷濫九橫陳之終古五枉更衍將來余以凡語難依聖情易照可依僧祇明斷隨物重輕必五衆亡後入重之財處斷或違如下顯相若當別主所護望主結其二罪謹慎防守望僧結之怠惰慢藏則望引護若現僧共分同賣皆望常住結之謂滿五皆須棄減者偷蘭遮也並如大鈔隨相釋之此則文據㦎然譬猶天分地裂形聲大矣人誰惑哉若昏冒未悛乃抱昔習者良以惡類卒而難屏故也二者四方常住僧物謂義通域外事限坊中故云然也物相如何即現熟僧供分噉之物是也若盜此物罪亦兩科主掌自偷罪便單結謂望四方僧人無滿五分唯結偷蘭遮約體分三品故也若有主守護望別結輕重謂滿不滿故也有人云無問生熟食具盜者偷蘭余亦謂之不然謂物體通局也前以人被四方法均凡聖故罪分二品並約根本究竟今集僧分食謂是可食者分之及至撾繫鐘磐何曾均行米麵但以四方僧侶望剎為家法食義通臨時進飯今若方中賦粟理須饋造若待成熟限期已過終非急濟豈曰當飢畫餅劇談驗之今矣故佛令聲召八方依時通給受者執鉢而仰請授者歡心而俯施皆即可進口不待火成若猶須搗炊便應持釜鑊五熟之器制必畜之此則罪漲滔天福流沈地必若然者則自煮內煮纏附未央壞生熟生卒難逃責今以凡心叵禁聖制易依故僧祇中時有盜將僧食還房佛言偷蘭此約四方僧不滿五也善見論中結重罪者為約守護為言耳此則輕重明文深有所以故結也前達通收輕重者濫委彌彰然教有開合前後相融若執現文俱須重斷故薩婆多云不打鐘而噉僧食者犯盜善見論云至空寺不擊磬而食果者亦犯盜此又正論明判承古彌難而文但言盜故盜通大小也故彼多見母等三論並云隨直多少結而不定罪名準例如上約判想無差二也由作法集僧但分可噉之食則米麵穀麥不是僧分若本由此等熟則可分故入輕者則田疇六畜園樹五行火調之器須分百穀之糧均給既飯時無此正法唯指現噉科之故知能熟衆具生舉襯糧即是不分僧物義同前段重物有損結之極刑文如本鈔所明部別照鏡以外五衆云歿現成熟食宜同上律具解通望四方不滿但結一品偷蘭必供濟別住義通事局宜作白二羯磨分上二物送給他寺者佛正開之三者四方現前僧物謂情通內外立法遮分即道俗七衆為僧得之施存亡五衆入分輕物等是也若據量罪相亦結兩途主掌自偷則望四方僧不滿五唯結偷蘭遮若有別主望別結重此謂未加法前故名僧財物則望三千世界一化通僧皆獲福利反資施主若盜此物望僧結之而僧終難集義須法約故聖令羯磨遮制外來若已加白二物局現集之僧而令通付一人任其量數分給若執掌自盜罪望現前結之若盜者避守護人罪便兩結謂專守望僧法慢藏望守護結故善生經云亡比丘物未羯磨前取望十方僧罪輕謂治輕業重也若已羯磨望現前僧罪重謂現治雖重未來業輕也四者當分現前僧物謂供身衆具限分衣資也猶事局別人非望僧結罪居兩位大如上陳皆望現前一身為財主縱有多人同活通望俱一科之猶財事既均故淨捨俱受律本云誰犯尼薩耆佛言若僧若衆多人若一人準此一人說淨通皆不犯罪也如僧祇云若衆多人分得分已中有善毗尼人為說淨者一切不犯若多人共財雖犯過限而無有罪以物雖現在情乖事別必須分破方名入已故彼律云若多人共分未入手等過日不犯捨墮若盜此物望護主結之即例囑授有勞仰而奪者余以輕重難分隨事條緒雖物名具顯判決灼然猶恐類聚繁多卒尋難曉便私情斟酌任意驅除回重從輕便招極法轉輕從重亦陷刑科或囑授未成曲筆斷與或負債漠落勇意付他或前事實虛或在緣難練遂私懷賕納託勢隨情回換重輕罔冒僧利並皆重罪懺脫難期故重委格言前後唱示既位非初果抵債義難必通濫始終方可科擬第二次用義門收束顯開制所由出處斷條緒雖與上門交映而意在悟迷前但約相用分而未通輕重深意今隨義曲解以類統收顯其聖教明文拔其量處弘致有殊途故分無爽然五衆亡物大要有三一制令畜物謂不得不有即衣鉢坐具等此並入輕謂輕可隨身資道要務故二不制令畜物謂畜便妨道故制止之即人畜寶物等此斷在重謂事資任重附俗心強雖有疏緣始益終損也三聽開畜物謂畜不畜俱得即供身衆具等此通輕重謂待緣及益本懷據道道在清虛隨機開制故也次解第一制令畜物初引文制畜後引文斷輕其例有三一者三衣謂僧伽梨上衣也鬱多羅僧中衣也安陀會此云下著衣律本云自今已去畜三衣不得過多論云一切外道無此三名佛自制立阿含云此名法衣也二者鉢器謂鉢多羅此單翻為鉢也律本云自今應持鉢行用鐵泥作應量受僧祇云此恆沙佛標志經中名為應器也三者坐具謂尼師壇也此翻為坐具如世中所用坐者亦名坐臥具即三衣總名亦為臥具如世敷被之總名也律本為身為衣為臥具故制必畜之僧祇云此是隨坐衣不得惡用也已前三件並入輕者由資道正要聖制令畜止令隨身不令缺減故佛言所行之處與衣鉢俱無所顧戀猶如飛鳥以此文證所為處重非不如法故入輕收由並制受持無緣輒捨必有違離俱結正愆故法衣以覆身應器以資養尼師壇具用以安坐必若乖制並制有罪次解第二制不聽畜物初引文證制不許後明斷在重意其例自五初田園種植律本中自種樹若教他不為佛法僧者名為行惡行善見云居士施田地別人不得受五分若施僧田宅聽受使淨人知之二養育人畜律本中大小持戒犍度中云沙門釋子不同餘外道廣畜人畜等廣明制斷僧祇云施僧奴婢及諸畜生一切別人不得自受為料理僧故受已付僧三伎樂衆歡具律本云受十戒者不應觀聽伎樂等善見云若施樂器者不得捉得賣四五兵戎器律本中不許比丘見諸兵戰乃至戲笑等善見云若施器仗者僧應打壞不得賣薩婆多云若以似寶或作男子莊嚴具如矛矟軍器樂器不得手投五錢穀七寶律本云有施錢寶者付淨人掌云此不淨物汝當知之餘不開僧祇中錢寶等入重已成百一物者入輕非謂金寶之器物也謂似寶銅鐵作者若不爾者豈有比丘執而受用可上下求文薩婆多云若金銀摩尼真珠珊瑚車渠碼瑙七寶捉者犯墮若似寶銅鐵等及雜色珠不入百一物數者捉取得吉羅不取如法說淨者得準付淨主知之僧祇中乃至知事人不得捉三寶金銀錢等及形像者皆墮善見云比丘不得捉生種子必有施者依多論十日內說淨付俗人知之已前五件通入重攝並招譏障道之元首也初田園務俗鄙儒士尚不窺臨況復出世五衆理非身所監護故智度論中云下邪命者謂耕田種植取利活命離此經營方名正命今親自執役或教人裁種污家惡行生過妨道染謗尤深故入重攝第二制者人畜生命事待資給比丘清舉高標濟遠今人畜同聚穢亂事深世事尚為供承何成入道津要既勞斃兩用故入僧中留放多途如前諸判第三制者伎樂蕩逸之器本非眼心所懷聞音尚制有愆何況眼觀無罪正制不令身觸為遣著心今便親自鼓持理由耽醉故有涕零垂淚解體移神俗士號為俳優良有以也既道禁彌塞過濫特深理宜焚毀用旌懲革然俗生歡美釋怒除紛微有供福之緣薄展歸依之相必有宜將出賣便順正論通文第四制者其戎仗軍器本妨慈道有國不獲已而設用擬非虞出道本厭今欣彌成過本或惡戒之數或生刀兵之劫現未俱損義豈停留宜打破焚除用傾踵惡第五制者金銀寶重錢穀利深能開不義之門正塞清升之道故經律同悲滅法道俗俱知穢心準論差人棄之顯強不淨之業然律通時議意在革愆生則說淨付他俗人掌護死則收入常住任委綱維次解第三聽開畜物律本廣張例如下述已前一段之物名狹事寬光蓮張教釰後方開例並由報優降隨務退增聖制被機意存據道若心懷正觀勵節拔群而力志雄壯風霜未拘其懷者則樹下坐但三衣以覆之乞食以充之但中下之徒心同上士而身報尫悴有願無施雖勵力前求而道根後退者權開華飾房宇綺靡衣資衆具緣須隨機通給本為增道非止養身故中含云我開諸弟子畜諸衣物者皆善法故持世佛藏經云若不除我倒隨事生著者乃至不許飲一杯之水服一納之衣何況餘事故知開意深重也不獲已開之律緣人情意存道業經約心帶事起因成全無貯畜靜緣修道故楞伽中寺內煙起者如實行人不應食也十誦亦云寺絶淨地涅槃經云雖開受畜如是之物要須淨施篤信檀越等正教明斷彌須謹依然根器鈍羸卒難回拔還須隨機附教任事重輕若據本開義須分取但為財物擔纍在無事則繁省間要故此一段類聚極多義該二僧事通輕重若據律斷通令不分以從多為論故也今總收諸類須三例分之第一性輕性重第二事輕事重第三從用輕重各分一半為三輕三重也先定三重之物初名性重由體相金石土木等所成重非隨道二名事重由非道要俗務所纏三名用重體是輕物附重難隨初性重之物有五一房舍所有謂窗戶簾幕竿架枰閣鎖鑰床席枕蓐燈具火爐爐等律本云檀越為比丘令隨作房法一切聽與事事具出如前猶多阿難得別房開受如僧殘中開造大小房白二加法作之又開給住房比丘大小繩床大小木床等又若夜暗須燈器鐵𣛰鐵炷火爐燈籠者開之二諸雜作具律本云時鐵作者出家欲作鉢佛開作之須爐槌鉗棑囊錯鏃器作袋盛之懸杙上亦開熏鉢調度治鉢者給鑽鍱及木作等器開畜縫衣患曲者開繩墨赤土絣治尺度等作桄張之三開畜器皿律本聽畜大小釜及蓋四瓫及杓并二瓶兩蓋尼開說淨僧則隨順終並隨於重輕不可以說淨非重又開煮藥銚鐵土三種釜瓶煎餅𨫼釣杓銅鐏搗藥杵臼簸箕篩掃帚暖水瓶澍水筒澡罐盤斗稱等諸裁衣皮之具浣衣具供給食具押果汁具並開又聽畜水瓶洗瓶盛水器此並供給比丘資道要用身所憑濟事不獲已上士頭陀衣鉢如鳥何用上物大成擔纍餘有一切俗家器皿盤梡盞合匙筯幝巾酒泉食案膾刀肉機凡非道用無問大小多少並入重收以斷俗懷專務出道故自餘有異於俗而是比丘要須者若準十誦一切石物一切瓦物一切銅物不應分器受二斗已上者一切水精物貝物齒物角物不應分半斗已上者律文如此而事雜重輕如前約相斷中具明分不分法必臨機正委不務籠通故也四助身之物律本云若老病不堪步涉聽作步挽車若輿若輦若車隨事並給除皮繩髮繩不得使比丘擔牽若道行恐毒蟲嚙當執錫杖搖若筒盛碎石若破竹作聲若患熱者聽作種種蓋自遮若作大扇若轉關扇小扇等又開如意唾壺廣如四分雜房兩聚五廟祀諸相律本云開五衆並得起塔廟俱得致禮謂依本夏次故僧祇律云律師法師營事比丘德望比丘死者應起塔相輪懸施幡蓋在屏處安置不得在經行處多人行處令僧和合已作之既許營塔廟理懷薦奉饌羞雖通凡聖表心義一故律本云令上塔種種美食金寶為器盛之設養食訖已與比丘沙彌憂婆塞經營塔作者食之應使白衣伎樂供養若有香華羅列基上欄上杙上簷前亦得用香泥作輪像乃至有餘應泥地增一中開比丘以香華散死尸上僧祇中亦爾已前性重之物體是沈纍根源約事無宜造修詳過義須遮斷但為人機弱劣隨事擁心故曲順物情權開通道前事繁雜有纍清神生則接其身資且聽服用死則斷入常住約絶踵前又送終禮供之物祭祀衆具所須正教正開用答恩造之德順生順俗彌旌息慢之儀若不具立影形則瞻仰何寄若不薄申微供則殷志寧生必斷入重輕如上如後具列故第一房舍所有律本正斷云若多有別房及屬別房物燈臺床蓐並入重收第二作具律本通列五種謂鐵陶皮竹木作并斧鑿之器並入重中第三器皿之屬律本通斷瓫瓶澡罐重物皆在重限未分大小量齊可準十誦二斗已上入重其斗量是非如前廣述第四助身衆具律本但有車輿杖扇入重餘全不論但是略無義須例顯並如上決第五廟祀供養衆具既有別屬即非自專還依本處若自造擬死後可入重收自外不盡之文義例自看上下次明事重之物其例自六律斷無文準如條顯初內外經籍律本中時有比丘盜他經卷佛言計紙墨得重故知別人畜也又開讀俗經書為伏俗故又為伏外道故開讀外經不依彼見故也右準斷云其內典經書如上母論所判其俗中九流傳集並可重收以久習多著樂世法故若有紙墨隨例重收若本為法化須有鈔録者則同輕攝二圖畫飾字律本開裝嚴房內文繡裝校并餘雜色人禽獸文者僧祇中比丘作房欲白壁五彩畫之佛並開聽唯除和合非法像餘有山林人馬像並開右準斷入重其餘彩色器具雜事及離壁素畫並是重收由久染耽著故也三皮毛重服律本邊方得敷羊鹿皮為三衣臥具更有餘者開不得畜師子虎豹獺皮及餘可惡十種皮若覆床以下馬皮不得坐上及一切皮衣皮帽不得著𣰽𣯫毛過三指長三肘廣五肘亦入重收右準斷𣰽𣯫成三衣相量者如前入輕若至中土便從重攝皮三衣者準上可知厚大者入重餘並不斷義約云既不許服用便成體重所收然以開於俗家邊地受用未是通遮故入事重中伊梨三皮律不斷者明是重攝四白衣之服律本云汝等癡人避我所制更作餘事自今已去一切白衣服不得著若著如法治白衣服者襖褶袴行膝手衣等十誦云五大色衣一切毛皮衣褊袖衣復貯衣一切氈衣一切貫頭衣兩袖衣一切囊衣一切衫袴禪並不得著右準斷云諸律斷中並無已上衣而入重者今以義約如律文中王施大價衣佛令應量者淨施明知異俗王衣可同此土山龍華蟲日月紛米之服也余聞施於冥告云西土諸王多重佛教外理國政則服俗衣內遵法行便懷道服咸著僧伽梨同比丘所服者其價極貴或出萬金故耆婆施佛一衣價直十萬而諸清信士女逮及菩薩在家咸著三衣乃至色有諸天亦同此服不同於王此土王臣士女依經亦有服者如梁陳時俗士等咸著用今以事用徵送教至如梁高祖親依佛教三衣錫杖而受持之所以登座講說脫於帝服著於法衣如簡文帝集中高祖數賜納袈裟表謝具明又蕭瑀為大唐僕射公事既了入靜院著三法衣禮佛讀誦以此為常及薨後送衣入津梁寺輕法羯磨近貞觀中太宗以所著七條納施勝光寺僧珍法師價直三萬及終後還追入內又以所著七條與恭宣二法師令製詩先成者與之及作一時成令學士評其勝劣俱云一等因令市估價直六萬乃進衣出絹人付百段又賜玄奘法師一納今現在有買者酬十萬猶不與之以此諸證故知王著貴價三衣不謬矣所以愛道在俗佛出家後戀慕無已手自成一金縷貴價㲲衣擬奉世尊後以獻佛令僧中行之愛道不從佛言但僧中行具三寶何者其人隨順我語供養佛也為解脫故供養法也衆僧受用供養僧也若供佛者失餘二歸便依行之並不敢受次至彌勒取而服之威儀具足言金縷者非用金也縷色同金光綵殊異裝飾若金豈有比丘服於金寶據此法衣理充在輕自餘一切白衣外道之服並不許服俱入重攝以斷惡法修出道標何得仍懷於俗事也如瓦屋綿衣斬壞打破絶流俗故息貪競故順知足故不同不淨財食死後通分食是非復畜煮財即同諸三衣今之僧服體狀全俗著即滯情故入重攝若已改張壞色失相或異常俗如裙如襖名雖含俗然相有殊並可從輕故褊袒祇支方裙正背俱非西梵所服然異東華俗儀故俯徒情事理義可通俱從輕限餘並例之以定二途五外道之服律本云一切外道衣不得著謂一切草衣皮衣樹皮衣葉衣鳥毛牛馬毛等衣今亦有著紙衣者此即是樹皮衣亦有大德高望著青色千秋樹皮袈裟者亦同外道衣也右準斷並重由體相既非若著壞心障道又生世不信必有輕服壞色相者如白衣中分之六文像綺服律本云不得著錦文衣繡衣五分繡錦褥敷者吉羅右準如五分律斷錦綺是不可分物若純色者應分由相類同於法衣故也無問大小多少俱在輕中其例朝霞斑布㲩𣰆之類並入重也已前六件並由事涉世譏本非道服宜通斷重而事容大小過起遲速貯備延促未可該含故隨條斷並各如別其俗衣兩斷義指如前猶存俗相者深取後文宜從輕限次第三解從用重物其例有四初以諸衣帛嚴飾房宇律本開畜地敷等即謂幄帳床帷承塵簾幕等右準斷云元作擬隨房宇即任住處受用要是隨時分房者方可留之若自擬改換權施受用者可隨輕物入分二以諸衣帛莊嚴飾車乘律開畜車輿理有隨車衣物前後㡙簾覆幰調度三以諸衣帛盛裹重物謂案帊床衣篋笥巾幞之覆右前二件之物若元作屬車乘案几亡後隨車必暫安非永可隨事輕重兩分四以諸衣帛隨身所障律開畜蚊厨五分云敷經行處衣障壁虱衣單覆衣謂床垂四角蚊厨是不可分右準斷如注入重亦本為隨身常障不容改換若如五分氈亦在重而不分大小若論隨床所用無論厚大入重必不定者準上衣量𣰽𣯫量任其重輕已前四件並是體非重分理入輕收但為擔纍沈積繫縛纏深故從重斷而義分四句句圖度之一以重宬重即木匱板倉土廩等宬五穀錢寶等二以重貯輕謂木函柳箱用貯衣鉢三以輕貯輕即衣帛等帊收束帛絹等四以輕宬輕重如上四條文自分矣初及第四入重二三兩事入輕大段第二次定三輕之物第一性輕之物其例自三初是十種衣財律中一一列名一者絶衣或名失利衣不同此方者二者劫貝衣中國出之緝花所作如白褻之例京師有也三名麻衣已外諸衣此無正翻並皆中天之物此方有無麻紵葛蕉竹蒲毛草等經緯用成諸衣財等右準斷入輕由體現交須即堪裁服無問多少厚薄若色非色若正不正並入分之有人云真緋正紫既大色上染佛斷不服著得墮罪故須入重今不同之由體是應法即堪改轉還類法衣如律受淨若以不許便入重者五大上色之衣佛並通制何為獨在緋紫一開一制但出意言耶若必擅遏不通者如生財絹匹綿屯及餘雜段財帛皆未染成亦不許服如何入輕故知並由改轉可成壞色同布絹之白色也又不同錦繡𣰅𣰆染則可得如法未染體是斑文綺錯外相五彩分炳又佛正斷在重無宜抑例通分二是所成之縷謂成前衣縷即用糸麻毛綿現在經緯及雜緝榮散績者右準斷並輕若麻𦃓糸絇如上已判若雜重物亦準前斷三是綿絮絓𦁲謂已離繭𪅏變成上相者右準斷云若現成前列者入輕若生熟蠶繭必害命因隨彼尸入重若蛾蟲自出𪅏之繭者準多論輕分然蠶所出絲綿計本深當性制故乞綿臥具三衣律斷斬銼塗埵又憍奢耶繒綵涅槃正制不服央掘許其轉來且接小機後云不成悲者非大乘行故五分云有將綿來施者受以入僧即非自己四分云若得已成者斬銼和泥判非所服由本損生害命而獲何成慈悲法服也正是懷道者所忌尤當譏過者初元今一方禪侶並不服之皆以布艾為衣裳可謂學大乘行之階漸也余親問西來遊僧五竺諸蕃無著蠶絹為三衣者雖于闐國養之而無殺害映前所言彌光大矣已前三件號曰性輕謂體是輕虛資道正要又隨身機濟深有事勞今從本而定輕名非在多而入重也類例並隨且斷蹊徑炳然而次第三件中絲綿所作者意猶疑妨何者由損害所利無宜在分生得尚銼壞滅蹤死後寧開分通計若準此義誠難決之且順央掘經中受者非悲而不破戒故在輕限必更有部決亦可從之若正心學大道者則從重例今西梵諸釋並不以為袈裟意可見也次解第二事輕之物其例自四初身所服衣律開三衣外畜覆肩祇支泥洹僧五約衣帽子腰帶櫬體衣氈被覆瘡衣雨浴衣𣰽𣯫衣拭身拭面捫淚拭腳攝熱等巾五分護髀膊踝頭衣針線袋僧祇若性不忍寒苦者斃故衣隨意重著右律斷三衣坐具入輕五分舍勒下衣及被可分應是三衣同臥具也餘雖無文由即用資強可從輕限二宬衣之物律本開以衣安囊中幞中三宅身之具律制畜尼師壇右前二件之物並入輕收初則從衣入分後則當體兩斷謂賞勞入輕也時有金皮絡朱絛界緣或復角揲萬字蓮華散飾者既律制不許畫鉢內為萬字明知衆具通然必有斯緣可從重例有相同跛闍之廣事從說淨可入輕收如法者入賞四漉水袋律令作漉水囊及漉瓶右諸律入輕亦有賞勞者此律不述可即輕收豫是宏槨袋覆者亦相隨分也已前四件亦號事輕由即用要機更非改貿故也必有文像綺飾可準上文斷之並須前後相銜方可斷斯途路次解第三從用輕物其例自六初一隨衣之物律中若著三衣解脫形露者可安帶及鉤衣𮢏鉤衣細等又衣無安處任箱函中盛之若著內衣易脫應用腰繩繫聽兩頭施玦紐不得用寶作當以銅鐵錫鑞等作之右準例從衣同斷入輕二鉢器者律令有鉢如上鉢量若得七日藥應著鍵𨩲小鉢次鉢大鉢中不作淨畜若應量者須說淨不者犯捨墮右律但斷鉢入輕餘諸隨鉢之器槃子盞子之徒相從輕例三隨物所屬律中若鉢難持作囊宬繫口絡肩上若函盛亦開巾幞右律斷入輕故亡人賞勞貯器之物相擬若其多者一則賞勞隨受持者餘則長攝自入輕分必有服飾裝嚴從本入分不同香爐寶裝由體自居重故也四屣屨之屬律開畜革屣除錦文裝嚴者若為補革屣故開錐刀磨石毛縷箸綖應以十種衣為袋盛之不令迸散并開裹革屣巾囊右律無正文斷然資身正要準僧祇分之自餘靴履之像綵裝者亦如上輕重五剃髮之器律開畜剃刀及鞘應以劫貝障勿壞并開磨刀石內囊中鈍者刮刃刀開之及承髮器右準律斷輕剪沐常要故也必有寶鏤莊飾身鞘者入重隨有木匣火皮分之六助身衆具律開針線刀子并線尺度用補衣也開作針氈及筒安塞及鑷子剪爪刀刮汗篦摘齒物桃耳箄灌鼻筒禪帶錐子之屬十誦澡罐釜瓶香爐尉斗禪鎮匕巵之屬也右並隨身要事理斷從輕故律制云無針無漉器不得遊行明知用資常有故也又如僧祇云受已制畜應法澡罐豈非機務所須耶故入分也又薩婆多云右似寶銅鐵雜色珠等入百一物數者得取不須說淨故知輕分為審已前六件之事號曰隨用輕收由物體沈重深非服用然隨事趣要更無過者故從時用例入輕收既聖制開聽故無定多少律開刀鉢及餘衆器現在僧分外雖不論準義必有針縷刀尺足可成衣鉤𮢏玦紐服常要具香爐澡罐之屬匙箸鋺盞之流文或顯晦事義準酌並如前列通斷在輕時有或斯義者便搆難重疊容色奮發赫然張怒詰余云我聞正律明斷澡罐入重剃刀入輕今汝拒違明非聖教余答教有開合文通隱顯律張四說經列法依澡罐從重大小未分刀鉢在輕體量通混今為計會諸部抑有明文理事含弘便定淆紊約量據體宜如兩分且決絶於臨機何遲疑於文相試為述其二三足為事類聯璧如剃刀有文入分裁刀無文在重鉢便三斗入輕瓶則半斗在重二文兩義雙皆俱違情理天乖事用同轍何角張於正教自負罪於將來今以當律無制量之文此即未了之說宜用外部通判便決滯於本條至於剃刀截刀錐針之屬餘律在輕雖文或左右而義類融會自外細雜輕可隨身即事交須又無譏醜律本文事缺斷不可經停宜從諸部明文並非重攝余以亡物輕重抑斷實難諸師傳授指訂非據所以博觀中表逖問嘉猷獲本衆多口斷非一核其精瞻程節者希余以不敏敢援前傑輒抽直筆隨事殺青言復義重望光修撰量處輕重儀大唐貞觀十一年歲在丁酉春末於隰州益詞谷中撰次余以自古至今諸有綴述多埋名而顯相少時代而開今遂令披讀悶於人世故分明昧用表幽心余自出家心存律部經今五十餘載常懷介然恨以教義未周臨機多擁雖伏膺高座而以行事為先涉歷炎涼亟經載紀至於持犯深旨彌有憲章輕重淺相情求路絶亦有高彥盛德常學律門聞斷重輕便存緘口目覩斯狀又增倒懸貞觀初年關表求解晉魏中原號稱學府即而請誨重增昔迷獨有相州律師制輕重相言雖綸綜還類古蹤由此意言遂出斯路皆比擬於成教絶遲疑於古今而以王著貴衣同於俗服邊方毛皮臥具類等輕分此則文義𨷂彰致令處斷斯咎幸以天人交迹意存據道云余所斷迷故非違白衣諸服佛制嚴明何得雷同如王衣例且王衣邊服本是三衣迷名同於臥具悟則更張琴瑟又云諸佛大聖尚有後制過前或復前開賒後及論行事並以後教廢前故稱智人名大覺也昔雖立儀大存比擬然非目驗故有小違可改白衣見成之服非輕已壞色相全乖非重故積念成佛初念似是而非第二反觀初則全非後是如是前後沓觀皆前昧而後明始自三賢終于十住乃至彌勒大士猶有一觀未融及至龍華道成方等十方妙覺況今沈俗凡僧動恆相結結既封執見結彌繁然則凡力所資堪耐在此至於不存心用何可而論故知王衣邊服並是三衣諸俗恆服宜從重攝又云比丘之法少欲知足為懷故佛見頭陀開房同宿諸有儲積同夏不前良以少欲顯入道之初門多積為恆俗之恥故制白衣俗服生絶禦之死絶分之令見存者絶於著用意存道撿不徒設也如是勤勤囑纍余以其過遂敢改以後釋前庶見此針幸同遺寄又云言非助道雖是佛說亦違縱是凡言雖非經文亦準故佛言雖非我制於餘方為清淨者不得不行此則佛自明言何得相通輕攝況不識王衣邊服之相故準而入輕前行迷而非過後結悟而是福用上諸誨可不信歟新刻輕重儀後序有必然事曰之死矣西天獨尊東域衆聖猶且預之苟預之則其釋迦法中輕重之儀判是須臾不可離者繇旃我法惠大師鈔疏明文雖勤尚為張沈文伏義或感靈以出之輕重儀雖輕重雜揉之中其文礌礌落落如日月皎然諸家竝珍三國引領良有以矣而祖宗中微之後此儀韜光也久矣樂學戒之賓銜茲于此於戲天不喪此文與偶於石清水神宮律寺書庫得之義雖若無巨害文少缺可謂危矣竊惟儀主依命晚住於西明則後人邂逅律策國師興正菩薩依命紹興于宮寺則今時邂逅此文斯知聖賢不苟來遊余又恐祖教時逸有負信大士輒寫焉然魚魯益以網羅句讀不無牆壁斯乃贅倭字于傍以應剖劂氏請之由耳冀有必然事之時判斷立得免假人于胡救溺之侮貞享五年八月十五日石清水大乘律院小苾芻實長春謹記于摩尼寶珠殿
