front:
  text: 新刻量處輕重儀序亡僧衣資處斷甚難蓋以聖教廣博而部計不同也往古宗師尚弗能無遲疑況淺學寡聞何由盡曉是故我高祖南山法慧大師括諸部大義立一家洪範著量處輕重儀用貽來裔其文煥然如日月之光而輕重之判無餘蘊矣所以歷代重之以為龜鏡也猗乎屬有鳩峯乘春律師是律海之長鯨也深慨其書雖存而傳世之不弘乃為對挍鍥梓流通余今秋偕在南京西大寺光明真言會場忽遇其成緒頂奉熏開歎曰斯典也曩招提真和尚始傳本邦以來大凡一千載未聞印行今時當末法之運觀此一舉揚豈不曰吾門之大幸乎哉春公徵余為序余抃躍之餘而不甚辭輒懸鄙辭少申隨喜庶樂學戒之士展轉流行遠達龍華同由斯文斷其輕重俱遵一道淨行云旹貞享五年歲在戊辰仲秋望旦終南山圓律宗後裔苾芻慈光慧門謹書于京北朝日山華嚴方丈
