body:
  text: 唐貞觀十一秊神州遺僧釋迦道宣緝敘乾封二年重更條理序曰余昔在帝京周流講肆深文伏義力志幽求頗嘗清敘惟以輕重為要而附事臨機多隨意情博訪明據文義莫憑先所宗承首律師者孤情絕照映古奪今鈔疏山積學徒雲踊齊流五部之輝通開眾見之表而準事行用浩汗難分學者但可望崖尋途未通鑽仰余曾請訣斯要直斷非疑便告余云夫講說者是通方之大解豈局一見而為成濟乎其猶身計國謀誠不可兩遂矣又以受通諸部隨相偏闕若限之一文則不流眾說余乃撫膺獨慨學本自攝兼他今隨以微緣而闇於決滯者豈名博贍機教弘濟時俗耶然則諸律持犯互說是非物類重輕據量者眾但約之受體紛諍自銷今此神州通行四分關中先用僧祇江表由來十誦及行受戒律儀皆多四分羯磨即以此律為本搜括諸部成文則何事而不詳何義而非決遂刪補舊章撰述事鈔雖體相諧允文據的明猶恐意用未周事須廣流視聽至大唐貞觀四年發憤關表四出求異傳見者多并部誦語守文河陽準疏約斷繁詞瑣語結軫連衡有魏郡礪律師者即亦一方名器撰述文疏獨步山東因往從之請詢疑滯而封文格義語密竟沈學士守句而待銷外聽披章而絕思亦以輕重難斷別錄疏文而前後亂繁事義淆紊乃是一隅之慧猶未通方共行今約先舊鈔更引所聞科約事類錄成別件名為量處輕重儀也原夫重物輕物皆望資道道在虛通義非局約由並因僧利而獲斯物故身亡之後還返入僧使二僧懷受用之資謂常住現前之僧俱荷重輕物利也兩施有福流之潤謂道俗七眾之人俱行僧得之施也故總判入僧不屬佛法計並入僧理亦通濟而僧有常住現前不同物亦輕重兩異故律中佛斷物並入僧及論附事方舒二別由斯約義處斷明須故於輕重之中深加剖決者由倒說輕重即懷二見律文正斷不許五眾故闕思尋但為物類難收諸部互缺現有儲畜教不備載約文附事濫委縱思物既現前義須決絕自古傳授梗概相承指事混如渺逾河漢余每於此路躊躇未引甞於業正之暇顧意思焉約教附情薄知途軌然諸師行事通悟者希隨見立儀六斷輕重竝有明據抑亦難求今但取一判用通諸說即以當律為正上下求文文或隱顯非明斷者則統關諸部例決相成庶今種類收羅科條有緒用備無悶兼被緣須意以普攝資生之財總收眾具之物附事決遲疑之咎臨時定輕重之儀執物案文不看他面隨機杼軸譬同抵掌冀懷道之士時復披尋足遣犯過極刑足除由來深惑然以人情忌狹擁結非無知事則親常住引輕入重別僧則私自利引重從輕倒亂昏情殷鑑終古承聞六百段絹入重屏風障子入輕之類出家據道彌須勵心鄙俗淺懷久須捐擲又夫邊服華夷儀形資具風俗既別物號亦殊竝準例決知輕重自別始末該覽足鏡規猷矣余所撰刪補行事鈔三卷篇分上中下也門有三十不同言有二十餘萬若僧法軌模住持綱要者則上篇上卷首領存矣若受戒種相持犯懺儀則中篇中卷名體具矣若衣藥受淨諸行務機則下篇下卷毛目顯矣故輒略總引粗知梗概今依下卷衣法之中單解六物略分十門初制入僧意門財因僧利佛法未霑豈彼王親輙俟收納二分法差別門約緣語事十斷不同唯第十同住死者方乃加法三同活共財門財生不義多懷鄙情存亡一期方稱此斷四囑授成不門決定捨施便須付他若疑慮未分則一僧定攝五員債還拒門債息追送隨本重輕必非明證義須深察六斷割重輕門輕重物相深究難分片有乖違便招雙咎七分物時處門殯送還返方可據量必有緣來異處科擬八撿德賞勞門有勞不賞事絕優矜無德僥倖義須撿駮九正分輕重門人財兩集聖法須遵依教即分無宜賣易十物之所屬門合得進不終是為僧縱外營理懸須給待此之十斷粗相且開而第六門中條緒非一律中通列諸物例竝入僧後別牒五三用分輕相此即物類亦有兩斷輕重隨義可知相傳隨義約判亦是一途匡濟而就律文卒撿傍附交加後銳前修猶懷綴慮沈於初學疑妨是難終未濟時故且刪削必欲曉緣據如後具明則迷悟俱開始終兩照故前依律本如佛斷之準事取類傍出附見隨務據量足為龜鏡也凡居處量之任宰割要模先擊磬集僧次總收現物已外重大資具歷悵具條對眾持讀令知顯晦先問共財同活隨信判之次問囑授有無亦隨機判後問負債是誰又隨撿付作上三法方定現財餘如本鈔律本云時有舍衛國多知識比丘死多有僧伽藍多屬僧伽藍園田果樹多有別房多屬別房物多有銅瓶銅瓫斧鑿燈臺多諸重物多有繩床臥床木床臥褥坐褥多畜伊梨延陀耄羅耄耄羅氍氀多有守僧伽藍人多有車輿多有澡罐錫杖扇多有鐵作器陶作器皮作器竹作器木作器剃刀多有衣鉢尼師壇鍼筒諸比丘不知云何白佛佛言多知識無知識一切屬僧律文如此準相約斷十三之別今依上條隨條具解並如下列也第一多有僧伽藍律斷入重準下種類亦同上判乃至屬伽藍物如下總判入重謂私有小寺莊宅店肆等第二多有屬僧伽藍園田果樹律斷入重準下種類例竝從之謂寺院內外所有園田果菜穀米眾具養生調度等其類有七一園圃所種菜蔬其例有四初謂現植五生種一根種蘿蔔薑芋之屬二莖種即榴柳及菜屬三節種即蘿勒蓼芹等四雜種蔗竹荻蘆五子種荽荏之屬二離地菜茹謂如上五生之屬即葵束菜聚等及有餘枝條莢糠𥢶等三餘留種子謂蘿蔔子蔓菁子蘭香荽蓼葵子等諸褁袋等四治園調度謂杴鍬鋤鑺杷朳之具及澆溉水車楔槹雜事二栽種五果之樹其例有三初現樹五果謂殼果即胡桃𭫻栗等膚果即梨柰林禽木瓜等核果即桃杏棗柿等角果山澤諸豆𥢶果松柏子等二離地果子謂乾棗梨李杏柿柑橘柤橙栗柚等并蔓草所產瓜瓠等諸蓏三樹枝皮殼謂諸果樹枝葉雜相三田農產植其例有四初水陸田具謂耒耜撈磨耬耩犁具鋤鏵刃器杷𣏐柯拂揚簸之屬二現種五穀謂房穀即粟秫等散穀即𢇲穄等角穀諸豆巨勝芒穀稻麥等類𥢶穀麻荏等類三離地五穀謂收訖粟穀𢇲黍麻穬大小豆麥等如僧祇中十七種穀者亦通一切諸穀等四是萁蒿等謂一切蒿草豆萁麻蒈稻草黍穰莢𦮽等四貯積倉廩其例有二初所貯庫藏謂庫倉囷廩窖厨匱匧簏箱斗斛函豆庾釜之屬二量準之器謂斛斗升合函籌尺寸衡秤之屬五造食眾具其例有三初轉生食具謂水陸碾磑碓磨扇車羅具之屬并所覆之屋二熟食之具謂鼎鑊鎗釜盆甑𨫼等并案橙机架及餅模雜具三盛食之具謂瓮𭺩瓮𤬪盤盂鉢盌檠合七勺等六現成五熟一蒸熟二煮熟三煿熟四炙熟五炮熟皆謂羹飯餅食類須五成七現在四藥謂時藥米麪醬豉麴菜二非時藥諸果清汁三七日藥酥蜜油脂四盡形藥鹽酢椒薑及五石三建等已前七件正本隨生準律據義斷入常住並由貯儲情厚譏醜塵染內外瑕愆勿過於此故毘尼母論云私有小寺園果堂房瓶瓫之屬養生之具此現前僧不得分屬四方僧即常住也至如造食眾具其例極多但得通收而限其大小相如十誦所列異律不可籠通若論木器如僧祇云木瓶木瓫竹筐竹筥並入重收又據餘部便依量限如十誦中一切器皿二斗已上入重猶事有擔累故也餘文如下更明若現噉之食如摩得勒伽論云若僧中請食已命過同衣分之準入重也若已命過後得食者還歸本處受他施衣亦爾其餘三藥必有長餘如下分之論有分全床者別部曲開此非機教如下廣解第三多有別房律斷入常住僧或有材石房直者如下判之已前謂伽藍內外村聚林野若有自乞他為造作大小諸房偏屬私己佛開受用若本主身死折入常住而寺法依時隨教分房者任留亦得若生熟材木塼瓦塹石草土房具并擬造房直物絹布錢穀並隨現物輕重分處以身存之時物有正主可隨言限若至死後更有別主不得仍舊第四多屬別房物律判入重種類準例如下別之謂窓戶㡘障竿桁枰閣壁鉤龍牙屋帳床帷承塵約壁床机之類已前約判義並重收皆謂本擬楷定不容中改者故入常住若為壁土圮坼開門牖敝露權以布帛幔障後須隨復屏除者不入此例第五多有銅瓶銅瓫斧鑿燈臺律文並重收然瓶瓫機濟大小未明如前兩判已前諸器謂銅鐵木瓦等所造準十誦中一切銅物不應分除釜瓶二斗已下應分乃至禪鎮等應分餘不應分此律但瓶瓫入重不出斗量致今傳習俱斷重收余謂瓶瓫機濟要務所須尼開說淨畜之僧則任情儲捨若通從輕攝事則該含宜從十誦明斷則彼此雙會餘如後解其斗秤尺量並用姬周本制者以通中邊同用百王不改其式故大唐雜令云尺者用尺二寸為尺斗秤二色三等成之乃至律論兩明器量大小並指秦斗三斗為定故知古法難改由楷式常然也昔東晉何承天者善明曆緯廣分星紀與慧嚴法師共評偏中律曆分影所次嚴師云中國之中剡洲之中心也四方距海各十有餘萬故彼夏至之日方中無影此方緣邊海隅豈同日而語乎故雒陽赤縣之中也至期猶有殘影故河圖云崑崙山東南方五千里亦號神州又稱赤縣既曰東南明非中矣又尺寸分次彼此通用晷日漏刻毫釐不差至如星次度量通國共行若隨方尺分則玄象交亂云云承天無以抗也故考諸實錄用擬今行又如薩婆多論云佛長丈六常人半之此方書云八尺身也故戒本云佛衣長佛九搩手廣六搩手五分云如來一搩手此方則二尺也即以此為率乘之則長一丈二尺今人衣長六尺唐尺則五尺若斯計會指掌可平昔隋煬帝博考經籍制立斗秤一準周時余親見用煥然符合故古俗傳述六尺為步量之所起圭抄在初度之最始忽絲為先衡分在初黍絫居首並有明據無宜逸縱第六多諸重物律斷入重意以名局事寬其例多種上下諸門隨相易見此中雜碎難顯隨務機要微有輕收故以諸門廣辨也其種有八義加俗器初宬衣眾具其例有五初成衣眾具謂衣衣床衣桄之具及赭土雌黃絣衣樣度繩索等二裁衣眾具謂裁版截刀剪刀磨石及擣帛杵石等三成衣機具謂綾羅錦綺紬絹絕布繩條帶索等機車之屬四紡績眾具謂紡車績筐經絡架桁杼緯車籰等調度五是繅抽之具謂繅車輕絡并養蠶薄棏等已上五件雖所為是輕而事相繁重卒難勝負又道分竦緣非親機要者並在重收就第二件中微有輕相如截刀剪刀佛開畜之通含大小可依經判四寸刃者無問鐵木角骨之柄從輕所攝若依量已上諸刀或以金寶飾者雖量乃寸刃從寶入重磨石體量律論無文若以刀同恒相隨者入輕二服翫之具謂曲机夾膝憑案懚囊如意語柄諸雜尾拂唾壺之屬已前一件物含勝降事實沈膚判非經道之具宜從重攝隨器奩匣衣覆並同三治病所須其例有三初謂醫術鍼灸刀角槌捍療疾之具二謂諸方本草明堂流注脈經藥訣之書三謂對病四藥如上列名餘之三藥如上入重盡形藥中如後正斷已上三件資身正要非常恒有是病即須初一治救刀鐵律文通許既是小細機候所宜準如十誦灌鼻箇等入輕所收餘有藥筒藥函諸器相從分也第二諸方本草既是俗習宜從重收盡形藥中未擣治者入重若已擣和合成湯丸膏煎異本藥相者及服殘餘分此實非所幸宜準僧祇入輕分之四內外經籍其例有五初內法經部謂凡所傳述為除心病心雖兩通約相據緣唯在於內故所救設者名為內法也謂凡所述事莫不為遣心瑕也初中土經部謂中土多羅葉經此方翻譯紙素六別一者單翻二重翻三失譯四雜錄五疑經六偽引二此方集錄謂佛法東流已來道俗諸賢各通揚化或造論錄或造讚傳皆非意指並入經收智論解也如童壽實相僧祐法苑文宣王淨住子梁簡文法寶聯璧等也三二方雜紀謂二方道俗通經解論各述意言解釋經義所有鈔疏等或傳述兩土名德高僧聖跡有無住持衰盛遊履記傳等也四擬寫經具謂紙墨筆硯案机枕則治紙界具裝潢帙軸等也五所盛經具謂厨箱簏匱函案架閣巾袋帊襆等也已上五件經籍格言正是入道津途出要窮務若不翫習通鑒始終統其關鍵悟其趣入者則舟車競載未登終非濟器教綱雖設不解虛喪明時故常須讀尋閱其理義可懷諸心首無從重期故毘尼母論云經律先有付囑處即付彼人若無付囑人隨能持者即依教進修非謂守護而已故論云佛法貴如說修行不貴多讀多誦今人多貪積無心服㱃者則不當所委須付德人若殘有筆墨紙素等及所盛經器本無轉用者依本處用隨經籍所在必具供獻非定屬者隨事輕重分入二僧或多積紙墨但擬治生本非經用宜從重攝二外俗書紀謂凡有紀傳皆存外有上則順天奉地匡國化民中則孝事父母立身行道下則營衛六府五行備附據事以求莫非身計縱閑放林澤無非養生故名外書初謂九流史籍九流者一道二儒三名四法五墨六縱橫七陰陽八農流九雜流即六經緯候諸子史傳雜說文紀等二謂三古字書謂三蒼古文篆籀隸皆真草諸迹等也三所盛書器即上內經所列者并餘紙筆墨硯等已前三件並斷重收雖開暫學為遮俗美終非久翫故捨入僧紙墨有餘乃兼道務而本意附俗不同前條並從重例經律正制者以莊嚴丈頌樂世法故三數算眾具其例有二一現有數具謂目翳懸測商度方衡籌算等也二雜珠數法謂水精瑠璃雜色珠等或用竹木泥土瓷石木梡薏苢等珠已前二件算數所須雖體並重物而堪隨道務律中猶不解事數誦戒忘誤開畜算子等至如木梡珠貫雜色偽寶所成之珍準用僧祇一切寶物入重則文含真偽今隨事緣求在機正要者勿過數法投接下根牽課修業也可準多論似寶偽寶雜色珠開為百一物者得如法用宜斷輕收餘木竹等例此分也五諸雜樂具其例有四初謂八音之樂一金樂謂鍾鈴等二石樂謂磬等三絲樂謂琴瑟等四竹樂謂笙笛等五匏樂謂箜篌等六土樂即塤等七革樂謂鼓等八木樂即上音柷𣣄者也二所用戲具謂傀儡戲面竽橈影舞師子白馬俳優傳述眾像變現之像也三服飾之具謂花冠帕索裙帔袍櫺纏束雜彩眾寶綺錯之屬也四雜劇戲具謂𮑱博碁奕投壺牽道六甲行成并所須骰子馬局之屬已上四件並是蕩逸之具正乖念慧之本宜從重收然僧非貯畜之家執捉非無過咎宜準論出賣得錢還入僧中隨常住雜用六雜莊飾具其例有二初謂采畫之具謂俗中畫樣丹青朱綠雜色及絣繩直尺專具規矩所須之物也後好翫眾具謂屏風障子山水人物遊仙古賢傳紀書隷及雜書異畫之具也已前兩件亦同上儀但可浮情所欣終非筌要宜擁入常住具飾僧堂七寶璧諸貨其例有四初是重寶謂金銀真珠摩尼珊瑚車渠馬碯此之七寶也及諸玉璧也二是輕寶謂鍮石銅鐵鉛錫白鑞并諸偽珠三是錢寶謂金銀銅鐵錢乃至皮作等八種上有文像者四所餘殘物謂鑪冶所須并𨥥朴鎔寫等具已前四件並是正重嚴禁俗財初及三四義非自畜容有助道說付白衣身亡入重故在常住二是輕寶隨緣三途若是本體塊叚銅鍮人來以施不擬形用則隨本重說付淨主若是百一椀鉢衣鉤之徒律開受用故在輕限銅叚擬用例此可分故僧祇中一切錢金銀真珠瑠璃珂貝珊瑚車渠馬腦玉石入重若已成器物入百一物數者入輕此非正寶也故僧祇云錢金銀不得觸若餘輕寶得觸不得著得作百一物用如論所明不須說淨準此作諸器具理非重收四分律中但明錢金銀三餘者不論明知通在輕限錫鑞之屬文雖不列律令用以補鉢非重物隨鉢入輕不疑今有擅行律教依論分金及錢金床等物此非統明成教隨文即用與己貪惑相符不唯教文明昧聖有四依四大墨印宜須憑準生死無暇聞聲即斷便同道聽今為重疎分金緣敘此文出於摩得勒伽論也此迦葉遺部本律不至於此非其所機言分金床者初有比丘從天生此人中資具非其所安情亂不安常思天中所有眾具佛令阿難依須給之一夕處中便登無學由此曲開非通今部分別功德論中具述此事故持世佛藏諸經佛令弟子修道為懷眾具有闕不能會道者並權開之必不修道樂世法者水不許服地不許行諸大鬼神遮前掃後斯豈人語大聖正言分金之徒並妄行不了之教順本貪貯便乖清信之徒焉有出俗高僧正制不行情存財事未足算也大般涅槃窮終之極教也一部之文十明八不淨物佛說魔說用此分途故文云若有人言佛開比丘畜於金寶八種不淨毒蛇物者是為魔說非我弟子反此上言是名佛說乃至文云祇桓比丘分金之事佛亦正斷分河飲水乃至四分律中迦旃延不受王之寶施因此如來制大小持戒犍度我之弟子不同諸外道沙門受畜金寶等叉如來滅後二百年毘舍離國跋闍比丘擅行十事說戒之日唱言分金時耶舍比丘集閻浮提七百人重更明斷不許分也佛在祇桓一制也滅後毘舍二制也今或有之三犯也分金犯於墮罪死入火中二十一億四十千歲耳此小罪也不信未來火燒現在亘火在身必信苦而欲去也今有犯於四禁經律同曰斷頭犯者安然不畏而作人師法主不信一犯九百二十一億六十千歲生報在無間中況此分金不足怪也學教之士並所共非豈意於今弊風重舉金為鄙俗之所重也聞名即欣管寧之徒矣若草芥流俗尚爾況出道乎縱有分者恒河長沒之人不足怪也但訶煩惱人不足論至如一化之制戒並絕俗前唯有四戒對俗重制一婬二酒三寶四邪命也婬為生死之本三聖絕其根源酒為昏醉之藥四逆由之得遂寶為起貪之緣諸惑因之繁苠邪命害我之因惡道為之開坦涅槃諸律備明顯之何不披讀聖典而行曲廢之教故文云日月不明淨者由煙雲塵霧所翳我法不淨者由於比丘行四事也若有弟子以我為師而行前四者我非其師彼非我之弟子由不信我之法律故也此之所說四分十誦現律論等咸有誠文何得依此律受戒而用彼部分金捨制而取開未識機教之通塞而與貪癡之相會不足統觀極教之明禁可不誡慎也之哉生則塵汗迷徒死則自當苦楚信一時之重欲為萬劫之凶愚深可悲矣八諸雜重物皆其例有八謂一切石一切水精一切瓦一切貝一切齒一切角一切銅一切色土義加俗中諸漆器食具初如十誦一切石物不應分除水瓶水瓮蓋水物刮汗灌鼻筒尉斗香爐鉢鉤禪鎮金瓶二斗已下應分餘石物不應分如齏臼藥碓臼及以杵具量雖未滿則非輕限餘並例知義加俗入器物如盤梡匙筯之屬並入重收廣如下出已前一段石物準上以斷律有通塞四分無文義須正準其供養香爐之具或是花香別類或鐵石銅鍮成者若常擬佛前供養不問金銀裝飾有無並隨本處用之若本心不定擬後轉易自資者隨前件斷入輕必有金銀鎣飾者入重若本懷供養則三寶通含則隨能受用者用本主出物造供養不許自資故入三寶若入輕分便成盜業可不慎耶故僧祇中錢金銀者不得捉畜若真珠琉璃珂貝珊瑚頗梨車渠馬腦者得觸不得著用明知作百一物得受用之上云不得著者謂同衣也如供養之具得加飾瑩縱律中寶裝飾具亦例餘輕寶者皆謂雜廁填內加以金銀故耳縱論中隨能供養者與之謂定別屬佛法故耳必有寶裝可如經論供養所判不入重收其餘香爐供具不定屬者即如律正斷分之其有火匙巾帒案匣奩具並隨香爐輕重所在必巾含綺繡隨本入輕以事在奉養不同鍼鉢之帒也若案匣重大非量所開或常不隨行或金飾寶鈿者別抽入重謂不隨輕香爐也二一切水精物不應分除釜瓶熏鉢鉤香爐熨斗餘如上說三一切瓦物不應分除釜瓶二斗已下應分水瓫蓋水物鉢小鉢半鉢鍵𨩲刀刮汗灌鼻筒熨斗香爐禪鎮除爾所物餘一切瓦物不應分已前瓦物中律文斷自二別佛開畜二釜二瓶四蓋四杓準斗量而定重輕其澡豆器或以銅鍮絞紵木皮軱瓠作者既常所洗濯鉢具要資準量入輕若重大難持及輕小隨處者入重雖開釜瓶止是供給要務或有含俗諸器未足在輕四一切貝物不應分除刀刮汗灌鼻筒熨斗香爐禪鎮熏鉢鉤宬眼藥函七鉢支應分餘不應分五一切齒物亦爾齒謂牙等器物六一切銅物二斗已下應分如上鉗鑷截爪刀子裁衣刀戶牌曲戶鉤等亦爾已前銅器總明斗量餘雖不出例準開之即鍮鐵鉛錫白鑞等是也又當律開分剃刀此由資用要器則隨有礪石袋匣相從入輕餘有刀子錐針等文雖不列而十誦有之正斷入輕如楞伽經中開畜四寸刃刀頭如月形為割截袈裟故毘尼母中亦開畜刀子六枚各有所為此則可準例也不問頭刃方尖柄之大小數之多少通斷輕收過量者重攝已外非法者雖小細物而入重中謂摘甲剃眉略毛刀等之類也七一切角物不應分除半斗已下應分除桿衣鉤壁上鉤刮汗灌鼻筒禪鎮藥函匕鉢支如是一切可分餘不應分八一切赭土不應分一切染色若煮未煮不應分餘有一切染色紫草黃蘗梔子乾陀等已前諸事八種不同十誦約體而斷故有分不分別今畜積之物同異者多不必如律可比其大小像貌商度輕重二儀如鉢支入輕鉢床應重熏鉢鉤入輕熏鉢籠入重如此類例隨務深思也義加漆器俗物謂俗中盤椀盞合須鉢食具匙筯食憚無問大小多少並入重收以全是俗有非道所用事同俗衣極制不畜出家衣鉢令異俗儀今若許分俗心不拔故令入重永斷世流第七多有繩床木床臥褥坐褥律斷入重餘類如別謂床橙案机榻苫薦席茵枕蓐等隨以竹木毛綿雜物作成者已上準斷入重言二褥者隨其大小多少皆謂內治氈為骨綿𭣋於外通以布帛縵之若但一邊氈布者入輕乃至坐蓐机束及㲲物相屬者通入重也其高座一色本擬說法誦經無問高下大小可屬法家受用第八多有伊梨延陀耄羅耄耄羅此前三件並是律文俱斷在重佛法東度爰至於今講解持律判輕重者咸言上三大小帳行步障耳初則伊梨延陀可非障次則耄耄諸羅豈非大小帳也帳似於帽故云耄羅用此當司一何可笑聞聲即判曾未討其字源隨語便翻即音定其體物此則勇於取類拙於事實且伊梨延陀名為鹿也經中所謂如來相如伊梨延陀鹿王之斯則多畜生鹿之皮也耄羅耄耄羅並是獸名狀如虎兕豹貊之屬皮厚毛軟而可坐之余曾以事問諸梵僧此二獸皮于遁已西諸國並有神州既無其物隨彼本土之音豈可即音定體便言帳障之物古人有言迷名生法癡誠可誡也隨文增五失深大累也尋名揣義陵咎多矣昔有開楞伽經外人問曰諸經或人法受名此經何為以苦具立目高座茫然莫知救解反以問之乃云楞伽豈非大枷八楞耶大眾道俗一時大笑所謂恥屈於一人之下呈拙於千萬之上者也伊梨鹿皮此方有而小異此則皮薄而毛𮧠彼則皮厚而毛柔若羊之皮恒可藉坐有而不同故存本名也三並皮物故在重收羊皮毛輕重下更為述氍𣯫此土本無其物皆從西北塞外而來若叢毛編織而出毛頭兼有文像人獸等狀者名曰𣰽𣯫字書總云罽屬若以經緯班毛如此綿者名曰𮗥𣰆用為地敷壁障也律本云氍氀毛長三指長五肘廣三肘者應分余昔以為量同三衣故入輕收氈被之屬例此分量而開輕重律文不了隨文則失近以乾封二年季春冥感天人厥姓費氏蜀人也夏桀之時生於南天王下為使者親樂律相躳受佛累弘護為懷謂余所撰鈔疏儀錄其失蓋微然於重輕隨濫則有雖隨律斷文非明了是翻譯過豈是學人可改前迷宜從後悟如氍氀體量乃逼三衣中國不開偏被寒土謂西北近海冬則極寒冬風裂竹衣服重厚有諸比丘住在斯土服三法衣無由取濟佛慈愍之為開教本若在此諸寒嚴國者多用布疊複貯著之若無此者彼有軟草織為成衣而服之又無草者可有樹皮槌打令軟而服之又復無者可以毛罽如𣰽氀法割截成三衣毛在於內披之又復無者可用諸皮亦同𣰽氀作三衣而服之如此次第漸漸而開若至中方自有法衣則樹皮等並入重也如律所制安得俗中𣰽氀依而修服無此事也律不云乎邊方開於五事諸羊皮等作臥具畜臥具即三衣也薩婆多論具解之但以三衣名相東土本無準如此方之臥具也即以名之坐具彼此俱有依名便會其體故律中寒雪國比丘頁安居竟南往佛所既出雪山地平時熱衣服厚重負持困苦余問重可幾何答云可重三石彼土諸人例皆長一丈已下故勝此衣佛開為令修道不為養形故至南方請開為道開聽一月五月權離此衣余撿十誦迦葉僧伽梨重三百斤冥符靈旨也錦綺斑紗此方有之文繡結纈織衣或布有班雲霞眾綵間錯無問士女用以成衣例準重收也已前一件準律如氍氀純色入輕雜者入重𣰽𣯫如前三衣之相在輕異者不問大小厚薄皆重四分不聽畜錦衣繡衣通多少廣狹五分錦綺毛𣯊拘執毛過三指不可分若純色者應分亦準上解如三衣相量者氈有厚薄厚者過三衣量入重減者得有隨道入輕被則不爾全是重收長衣不開被非淨施故是俗物非出道用若通開者與俗不殊故諸俗服白衣服外道衣並不開畜深有大意恐壞道也無問厚薄大小白衣外道之服並入重收律中比丘著此二服至佛所言此是頭陀端嚴法願佛聽佛言汝等癡人避我所制更作餘事自今已去一切白衣外道服不得畜著嚴教若此何敢陵之故絕浮議氈此有重輕薄須條理𮑤厚過三衣如上斷重軟薄甚可裁縫無論大小多少入輕故律中老病比丘服氈僧伽梨乃至六年臥具雜色臥具等皆氈三衣也用以尋事不同𣰽氀彼則全是俗懷此氈通於道務也餘有單敷被單之屬既不同被相等漫布三衣可從輕限故五分云𭣋身衣即身瘡而𭣋三衣者四分覆瘡衣者是也單敷衣謂敷在床上垂四面者皆聽入輕豈可藉下非重上覆非輕故可例知其分齊也第九多有守僧伽藍入律斷入重其例既多如下多判大分為六一謂施力供給二謂部曲客女已前二件雖良賤乃分而繫不繫別前條施力有二種人若能給盡形隨僧處分若所給盡形前僧既終後情自改任意去留若他遣供給還送本主若本是自已有倩俗蔭覆者依本入僧若暫來非永隨時將送第二部曲者謂本是賤品賜姓從良而未離本主本主身死可入常住衣資畜產隨身所屬不合追奪若本擬盡形供給手疏分明者準毘尼母論放去三謂奴婢賤隷所有子息資生並入常住若身死無親者常住收之已前一條判如母論云若私有奴婢應放令去如前條中若不放者作僧祇淨人四謂畜諸家畜即駝馬驢牛羊等并鞍韀秦轡縶闌圈槽櫪等五謂畜諸野畜即猿猴麞鹿熊羆雉兔山鷄野鶩鵝雁等類并以籠架等六謂畜惡律儀即猫狗殦梟鷹鷂鼠蠱鼠弩弓檻等及弓箭五兵機羅殺具者已前六件前三隨事已明第四家畜之中既是煩慮之元宜從重攝故母論駝馬驢等可與寺中常住僧運致已外所有乘具隨所畜之如有鞭杖苦具並須焚蕩以生譏責故也第五野畜彌是障道故僧祇中若將來施不合受之令給水草翅成放去由畜翫妨道世中多有放鷄猪鵝鴨者亦自塵染清徒有畜鸚鵝鳩烏者彌是道俗同恥必有斯鳥獸可放山林川藪籠架拘縶之具總集以火焚之第六惡律儀具事類乃希時復緣邊塞首中表無知或加畜用既事在罪增並可焚屏則同瓦屋之非法也故善見論云若有施器仗者僧應打壞不得賣若賣與人前得行殺賣者同業故論中其有畜非法之物眾主破之無捐財咎正論明斷準用何疑亦有養畜猫狗專行殺害經論斷在惡律儀同畜便失善戒出賣則是生類業障更深施他還續害心終成纏結宜放之深藪任彼行藏必繫之顯柱更增勞役但依前判彼我夷然便息生殺怨家新樹慈悲聖宅其餘鷙鳥例此騰空第十多有車輿律斷入重準例下斷其例有三初常所乘御謂水陸船乘牛羊步挽等車輿并供給船車篙簟繩索等二送終凶器謂𭅭輴雜飾車輿隨車所須僛人盟器棺槨構檀衣衾雜服塚墓塼石松柏雜樹碑礙銘誌等物也三祭祀器具謂簠簋宗彝爼豆罍斚蹲巵椀杓盤合檠机等已前三件並是重收下二凶祭之具若預作擬後者身亡並入常住若為內外親姻七眾道俗追旌故實光衍將來而造作者身雖亡沒隨屬所為之緣由決本原捨別屬故也第十一水瓶澡罐錫杖扇律並斷重今以文義相映互交輕重已前一段若準律本通例重收斯何故耶由體相俱重從多約判如瓶罐之器資道要緣理須入輕不同杖扇以大小通約用有時限兼加聖法乃得畜用瓶罐不爾隨身澡漱滌穢洗沐事起常須義必輕收無宜入重又諸部相映非重者多故五分云除瓦澡罐聽分餘不應分此即正斷入輕若約量通會律本入重者據大瓶為言也故十誦云銅瓦澡罐二斗已下入輕此則明顯灼然通衢達矣古來傳授並依律斷意以資身接道要務常須恒用又制自隨故在輕也又諸律明判非敢自量故僧祇中新受具已令畜應法澡罐將行明知大者非法不堪隨道可如律本斷重者是也又如剃刀鉢器並是性重由供濟處深在緣正要並斷在輕瓶罐急務過前義無重攝故博通異部精練是非既博且精事無疑豫已外瓷瓦瓶罐例上大小重輕第十二多諸雜作器具其例律自分五並斷入重例如後判也初鐵作器謂鑪冶鍋鉗碪錘鞲具鈷鍛錯鏇等器并餘有鐵炭等二陶作器謂輪繩袋簙鍬钁杴杖一切埏埴等具并餘泥土塼瓦墼凷等也三皮作器謂瓮瓫床桄刀剗熨鐵雜揮之屬并餘有皮毛生者不應分四竹作器謂刀鋸之屬二是金竹破篾青笨𮅧筏及雚葦茅荻雜草等五木作器謂斧鋸竹剗之屬并彫刻之具并餘有材木薪蒸柹禮等也已前五件種類重收古德同詞並解云不問能成所成及餘模塑皆重此則濫通輕相取例難分今以文義相驗並指能成之器如前者是故律中諸木作器無盛處佛令作囊盛之故知非所成之鉢器也若有現成之器如釜鑊等瓫瓮之屬並在諸門已收若準古德收言則眾具不過此攝便妄列多位徒費譯功其熟皮韋具如十誦中入輕已前伊梨耄羅三皮既是生者四分不斷但依氍氀故知三皮不入分限邊方皮衣開畜無三衣相何必在輕若至布鄉皮還入重邊方開坐何必在輕縱許皮韋具充資下之用以一切皮衣不許著故餘有錐刀雜器之屬準例兩判若常擬木作者宜從重收若常擬隨身補綻者便從輕限故也
